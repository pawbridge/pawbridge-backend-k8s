plugins {
    id 'java'
    id 'org.springframework.boot'
}

sourceSets {
    architectureTest
    compatibilityTest {
        java.srcDir layout.buildDirectory.dir('generated/sources/f2LegacyOracle/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    compatibilityTestImplementation.extendsFrom implementation, testImplementation
    compatibilityTestRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    implementation project(':user')
    implementation project(':community')

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    compatibilityTestImplementation platform('org.springframework.cloud:spring-cloud-dependencies:2024.0.2')
    compatibilityTestImplementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    compatibilityTestImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    compatibilityTestCompileOnly 'org.projectlombok:lombok'
    compatibilityTestAnnotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    compatibilityTestAnnotationProcessor 'org.projectlombok:lombok'

    architectureTestImplementation platform('org.junit:junit-bom:5.11.4')
    architectureTestImplementation 'org.junit.jupiter:junit-jupiter'
    architectureTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    architectureTestImplementation gradleTestKit()
}

tasks.named('bootJar') { archiveFileName = 'pawbridge-backend-app.jar' }
tasks.named('jar') { enabled = false }

tasks.register('prepareLegacyOracle', Exec) {
    inputs.file(rootProject.file('scripts/prepare_legacy_oracle.py'))
    outputs.dir(layout.buildDirectory.dir('generated/sources/f2LegacyOracle/java'))
    outputs.file(rootProject.layout.buildDirectory.file('ci/oracle-sha256.txt'))
    commandLine 'python3', rootProject.file('scripts/prepare_legacy_oracle.py'),
            rootProject.projectDir.parentFile, layout.buildDirectory.dir('generated/sources/f2LegacyOracle/java').get().asFile,
            rootProject.layout.buildDirectory.file('ci/oracle-sha256.txt').get().asFile
}

tasks.named('compileCompatibilityTestJava') { dependsOn tasks.named('prepareLegacyOracle') }

['compatibilityTest': 'UTC', 'compatibilitySeoulTest': 'Asia/Seoul'].each { taskName, zone ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Checks isolated PG, legacy mapping and nickname transport in ${zone}."
        testClassesDirs = sourceSets.compatibilityTest.output.classesDirs
        classpath = sourceSets.compatibilityTest.runtimeClasspath
        systemProperty 'user.timezone', zone
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
        shouldRunAfter tasks.named('test')
    }
}

tasks.named('compatibilitySeoulTest') { shouldRunAfter tasks.named('compatibilityTest') }

// TestKit has a Gradle logging provider; isolate it from Spring/compatibility tests.
tasks.register('architectureTest', Test) {
    group = 'verification'
    description = 'Exercises the production Gradle boundary guard in isolated TestKit fixtures.'
    testClassesDirs = sourceSets.architectureTest.output.classesDirs
    classpath = sourceSets.architectureTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    systemProperty 'test.gradle.home', gradle.gradleHomeDir.absolutePath
    systemProperty 'architecture.guard.file', rootProject.file('gradle/architecture.gradle').absolutePath
    systemProperty 'architecture.gradle.user.home', gradle.gradleUserHomeDir.absolutePath
}

tasks.named('check') { dependsOn tasks.named('architectureTest') }
