            failOnNoMatchingTests = true
        }
        shouldRunAfter tasks.named('commentUpdateCompatibilitySeoulTest')
    }
}

tasks.named('profileCompatibilitySeoulTest') { shouldRunAfter tasks.named('profileCompatibilityTest') }

