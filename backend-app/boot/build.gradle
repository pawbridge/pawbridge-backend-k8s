['compatibilityTest': 'UTC', 'compatibilitySeoulTest': 'Asia/Seoul'].each { taskName, zone ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Checks isolated PG, legacy mapping and nickname transport in ${zone}."
        testClassesDirs = sourceSets.compatibilityTest.output.classesDirs
        classpath = sourceSets.compatibilityTest.runtimeClasspath
        systemProperty 'user.timezone', zone
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
        shouldRunAfter tasks.named('test')
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlCommentDeleteCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlCommentUpdateCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlUserProfileCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlUserNicknameCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlFavoriteStatusCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlHomeVideoCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlVisitTodayCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlVisitTodayAccessTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F16LegacyVisitMvcTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlNoteRecipientCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F17LegacyRecipientLookupTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlBlockedAuthorsCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F18LegacyBlockedAuthorsMvcTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlTotalUserCountCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F19LegacyTotalUserCountMvcTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlNoteBlockListCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F20LegacyBlockListMvcTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlNoteNotificationsCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F21LegacyNotificationsMvcTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlPrivateNoteReadCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F22LegacyPrivateNoteMvcTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlPrivateNoteListCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F23LegacyPrivateNoteListMvcTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlNoteBlockRemoveCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F24LegacyNoteBlockRemoveMvcTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlNoteBlockCreateCompatibilityTest'
        filter.excludeTestsMatching 'com.pawbridge.backend.compatibility.F25LegacyNoteBlockCreateMvcTest'
    }
}

['commentDeleteCompatibilityTest': 'UTC', 'commentDeleteCompatibilitySeoulTest': 'Asia/Seoul'].each { taskName, zone ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Checks only F10 comment deletion after the owned ACL extension in ${zone}."
        testClassesDirs = sourceSets.compatibilityTest.output.classesDirs
        classpath = sourceSets.compatibilityTest.runtimeClasspath
        systemProperty 'user.timezone', zone
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
        filter {
            includeTestsMatching 'com.pawbridge.backend.compatibility.PostgresqlCommentDeleteCompatibilityTest'
            failOnNoMatchingTests = true
        }
        shouldRunAfter tasks.named('compatibilitySeoulTest')
    }
}

tasks.named('commentDeleteCompatibilitySeoulTest') { shouldRunAfter tasks.named('commentDeleteCompatibilityTest') }

