plugins {
    id 'java'
    id 'org.springframework.boot'
}

sourceSets {
    architectureTest
    compatibilityTest {
        java.srcDir layout.buildDirectory.dir('generated/sources/f2LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f3LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f6LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f7LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f8LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f9LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f11LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f12LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f13LegacyOracle/java')
        java.srcDir layout.buildDirectory.dir('generated/sources/f14LegacyOracle/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    compatibilityTestImplementation.extendsFrom implementation, testImplementation
    compatibilityTestRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    implementation project(':user')
    implementation project(':community')
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.0.3')
    implementation 'software.amazon.awssdk:s3'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.postgresql:postgresql'

    compatibilityTestImplementation 'org.apache.lucene:lucene-analysis-nori:9.12.3'
    compatibilityTestImplementation platform('org.springframework.cloud:spring-cloud-dependencies:2024.0.2')
    compatibilityTestImplementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    compatibilityTestImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Compile/load only the original advice exception type; no Redis driver or runtime service.
    compatibilityTestImplementation('org.springframework.data:spring-data-redis') { transitive = false }
    compatibilityTestCompileOnly 'org.projectlombok:lombok'
    compatibilityTestAnnotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    compatibilityTestAnnotationProcessor 'org.projectlombok:lombok'

    architectureTestImplementation platform('org.junit:junit-bom:5.11.4')
    architectureTestImplementation 'org.junit.jupiter:junit-jupiter'
    architectureTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    architectureTestImplementation gradleTestKit()
}

tasks.named('bootJar') { archiveFileName = 'pawbridge-backend-app.jar' }
tasks.named('jar') { enabled = false }

tasks.register('prepareLegacyOracle', Exec) {
    inputs.file(rootProject.file('scripts/prepare_legacy_oracle.py'))
    outputs.dir(layout.buildDirectory.dir('generated/sources/f2LegacyOracle/java'))
    outputs.file(rootProject.layout.buildDirectory.file('ci/oracle-sha256.txt'))
    commandLine 'python3', rootProject.file('scripts/prepare_legacy_oracle.py'),
            rootProject.projectDir.parentFile, layout.buildDirectory.dir('generated/sources/f2LegacyOracle/java').get().asFile,
            rootProject.layout.buildDirectory.file('ci/oracle-sha256.txt').get().asFile
}

