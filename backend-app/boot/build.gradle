tasks.named('commentUpdateCompatibilitySeoulTest') { shouldRunAfter tasks.named('commentUpdateCompatibilityTest') }


tasks.named('compatibilitySeoulTest') { shouldRunAfter tasks.named('compatibilityTest') }

// TestKit has a Gradle logging provider; isolate it from Spring/compatibility tests.
tasks.register('architectureTest', Test) {
    group = 'verification'
    description = 'Exercises the production Gradle boundary guard in isolated TestKit fixtures.'
    testClassesDirs = sourceSets.architectureTest.output.classesDirs
    classpath = sourceSets.architectureTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    systemProperty 'test.gradle.home', gradle.gradleHomeDir.absolutePath
    systemProperty 'architecture.guard.file', rootProject.file('gradle/architecture.gradle').absolutePath
    systemProperty 'architecture.gradle.user.home', gradle.gradleUserHomeDir.absolutePath
}

tasks.named('check') { dependsOn tasks.named('architectureTest') }


['profileCompatibilityTest': 'UTC', 'profileCompatibilitySeoulTest': 'Asia/Seoul'].each { taskName, zone ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Checks only F12 profile reads after the owned User fixture extension in " + zone + "."
        testClassesDirs = sourceSets.compatibilityTest.output.classesDirs
        classpath = sourceSets.compatibilityTest.runtimeClasspath
