spring.application.name=pawbridge-backend-app
server.address=127.0.0.1
server.port=${PAWBRIDGE_SERVER_PORT:0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.sql.init.mode=never
spring.jmx.enabled=false
pawbridge.visits.enabled=${DAILY_VISITORS_ENABLED:false}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

pawbridge.chat.enabled=${MEMBER_CHAT_ENABLED:false}
pawbridge.chat.namespace=${MEMBER_CHAT_NAMESPACE:}
pawbridge.chat.allowed-origins=${MEMBER_CHAT_ALLOWED_ORIGINS:}

# Original user-service SMTP client settings; host, username and password come only from the environment.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Former Gateway features. Origins default to the Gateway globalcors list (see GatewayCors).
# pawbridge.cors.allowed-origin-patterns=https://example.invalid
# TEMPORARY: rewrites old /api/** paths to /api/v1/**. Set false once the frontend calls /api/v1, then remove the filter.
pawbridge.legacy-api-paths.enabled=true

# Actuator is served only on the separate management port, never on server.port. Exposed: health (liveness/readiness
# included), info and prometheus; no other endpoint. The port must stay unpublished (internal Prometheus only).
# The address stays on loopback unless the container sets PAWBRIDGE_MANAGEMENT_ADDRESS=0.0.0.0.
management.server.port=${PAWBRIDGE_MANAGEMENT_PORT:9464}
management.server.address=${PAWBRIDGE_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
# Bounded latency buckets (7 + +Inf) so p95 can be computed without a per-URI histogram explosion; the uri tag is the
# matched MVC template (/api/v1/posts/read/{id}), and unmatched paths collapse into NOT_FOUND/UNKNOWN.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s
# Spring Security's own per-filter observations add dozens of series per request without answering an operator question.
management.observations.enable.spring.security=false
# Needed for the tomcat_threads_* and tomcat_sessions_* meters.
server.tomcat.mbeanregistry.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# No SMTP probe in the overall health; K8s probes should use /actuator/health/liveness and /readiness.
management.health.mail.enabled=false
