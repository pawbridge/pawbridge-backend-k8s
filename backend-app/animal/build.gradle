plugins {
    id 'java-library'
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework.batch:spring-batch-core:5.2.4'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.springframework.data:spring-data-jpa'
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.postgresql:postgresql'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.springframework.security:spring-security-core'
    runtimeOnly 'org.hibernate.orm:hibernate-core'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    annotationProcessor 'org.projectlombok:lombok' 
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'io.github.openfeign:feign-core:13.5'
    implementation 'io.github.openfeign:feign-form:13.5'
    implementation 'org.apache.lucene:lucene-analysis-nori:9.12.3'

    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'ch.qos.logback:logback-classic'
}
