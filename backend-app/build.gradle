plugins {
    id 'base'
    id 'org.springframework.boot' version '3.4.11' apply false
    // Kotlin 1.9.25 is the version managed by the Spring Boot 3.4.11 BOM (kotlin.version).
    id 'org.jetbrains.kotlin.jvm' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25' apply false
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

allprojects {
    group = 'com.pawbridge.backend'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    // Every module accepts Kotlin next to Java: Kotlin compiles first and Java sees its classes,
    // and a module without .kt files skips the Kotlin compiler (NO-SOURCE). The plugin is applied
    // here, before each module script: applied from the plugins.withId('java') callback below,
    // KGP 1.9.25 fails with "KotlinPluginLifecycle cannot be started in ProjectState 'EXECUTED'".
    apply plugin: 'org.jetbrains.kotlin.jvm'
    // all-open for Spring stereotypes, so @Configuration/@Transactional proxies still work.
    apply plugin: 'org.jetbrains.kotlin.plugin.spring'
    // no-arg constructors for @Entity/@Embeddable/@MappedSuperclass, as Hibernate requires.
    apply plugin: 'org.jetbrains.kotlin.plugin.jpa'

    kotlin {
        jvmToolchain(21)
    }

    // Keep JPA types non-final like their Java counterparts so Hibernate can still proxy them.
    allOpen {
        annotation('jakarta.persistence.Entity')
        annotation('jakarta.persistence.MappedSuperclass')
        annotation('jakarta.persistence.Embeddable')
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
            // Treat Spring's @NonNull/@Nullable (JSR-305) as real Kotlin nullability.
            freeCompilerArgs.add('-Xjsr305=strict')
            // Write type-use annotations such as List<@NotNull UUID> to the class file like javac does;
            // Bean Validation container element constraints are read from them.
            freeCompilerArgs.add('-Xemit-jvm-type-annotations')
        }
    }

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }

        dependencies {
            // Versions come from the Spring Boot platform each module already imports.
            implementation 'org.jetbrains.kotlin:kotlin-reflect'
            implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
            testImplementation platform('org.junit:junit-bom:5.11.4')
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            maxHeapSize = '256m'
            maxParallelForks = 1
        }
    }
}

apply from: 'gradle/architecture.gradle'

tasks.named('check') {
    dependsOn subprojects.collect { "${it.path}:check" }
}
