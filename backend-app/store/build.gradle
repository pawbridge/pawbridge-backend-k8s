// Proposed backend-app/store/build.gradle; root integrates the module and Boot wiring.
plugins { id 'java-library' }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.11')
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-tx'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    implementation 'org.apache.lucene:lucene-analysis-nori:9.12.3'
    testImplementation 'org.springframework.data:spring-data-commons'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.security:spring-security-web'
    testRuntimeOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}
