name: Backend CI policy
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  test:
    name: Policy contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
  policy-result:
    name: Backend CI policy result
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all policy tests to succeed
        env:
          POLICY_TEST_RESULT: ${{ needs.test.result }}
        run: test "$POLICY_TEST_RESULT" = success
