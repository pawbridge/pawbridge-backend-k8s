name: Backend app check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select backend app validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.selection.outputs.selected }}
      profiles: ${{ steps.selection.outputs.profiles }}
    steps:
      - name: Check out source for selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select application and CI policy changes
        id: selection
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts")
          from ci_branch_policy import changed_paths, validate_event
          from backend_contract_profile import select_profiles

          paths = changed_paths(os.environ, validate_event(os.environ))
          selected = any(
              path.startswith("backend-app/")
              or path in {
                  ".github/workflows/backend-app-check.yml",
                  ".github/scripts/test_backend_app_ci_policy.py",
                  ".github/scripts/ci_branch_policy.py",
                  ".github/scripts/backend_contract_profile.py",
                  ".github/scripts/test_backend_contract_profile.py",
                  ".github/scripts/backend_postmerge_proof.py",
                  ".github/scripts/test_backend_postmerge_proof.py",
              }
              for path in paths
          )
          payload = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = payload.get("pull_request", {})
          context = {
              "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "head_repository": pr.get("head", {}).get("repo", {}).get("full_name", "") if pr else os.environ.get("GITHUB_REPOSITORY", ""),
              "head_ref": pr.get("head", {}).get("ref", "") if pr else os.environ.get("GITHUB_REF", "").removeprefix("refs/heads/"),
              "base_sha": pr.get("base", {}).get("sha", ""),
          }
          profiles = select_profiles(context, paths)
          print("selected=" + str(selected).lower())
          print("profiles=" + json.dumps(profiles, separators=(",", ":")))
          PY


  proof:
    name: Resolve postmerge validation evidence
    needs: selection
    if: ${{ needs.selection.outputs.selected == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.proof.outputs.mode }}
    steps:
      - name: Check out the exact candidate for evidence selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the bounded postmerge decision without network or application resources
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_backend_postmerge_proof.py'

      - name: Decide validation or reference one reviewed PR result
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B .github/scripts/backend_postmerge_proof.py --output build/ci/postmerge-proof.txt >> "$GITHUB_OUTPUT"

      - name: Preserve the decision separately from original test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-app-postmerge-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/postmerge-proof.txt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  package:
    needs: [selection, proof]
    if: ${{ needs.selection.outputs.selected == 'true' && needs.proof.outputs.mode == 'execute' }}
    name: Build the shared Java 21 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      jar_sha256: ${{ steps.package.outputs.jar_sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: backend-app
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            backend-app
            .github/workflows/backend-app-check.yml
            .github/scripts/backend_contract_profile.py
          sparse-checkout-cone-mode: false

      - name: Isolate Gradle state on the hosted runner
        run: |
          set -euo pipefail
          printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/pawbridge-backend-app-gradle" >> "$GITHUB_ENV"

      - name: Set up Java 21
        id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          check-latest: true

      - name: Set up Gradle Wrapper validation
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
          add-job-summary-as-pr-comment: never

      - name: Record the tested runtime
        env:
          JDK_DISTRIBUTION: ${{ steps.java.outputs.distribution }}
          JDK_VERSION: ${{ steps.java.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/ci
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'runner_architecture=%s\n' "$(uname -m)"
            printf 'jdk_distribution=%s\n' "$JDK_DISTRIBUTION"
            printf 'jdk_version=%s\n' "$JDK_VERSION"
            java -version 2>&1
          } | tee build/ci/runtime-metadata.txt
          bash ./gradlew --version --no-daemon --max-workers=1 -Dorg.gradle.parallel=false | tee build/ci/gradle-version.txt
          grep -Fx 'Gradle 8.14.3' build/ci/gradle-version.txt

      - name: Check modules, boundaries, unit tests and executable JAR
        run: bash ./gradlew projects check :boot:bootJar --no-daemon --max-workers=1 -Dorg.gradle.parallel=false

      - name: Compile the PostgreSQL compatibility test without running it
        run: bash ./gradlew :boot:compileCompatibilityTestJava --no-daemon --max-workers=1 -Dorg.gradle.parallel=false

      - name: Bind the candidate JAR to this checked source
        id: package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum boot/build/libs/pawbridge-backend-app.jar > build/ci/boot-jar.sha256
          printf 'jar_sha256=%s\n' "$(cut -d ' ' -f 1 build/ci/boot-jar.sha256)" >> "$GITHUB_OUTPUT"

      - name: Verify production JAR isolation before sharing the candidate
        run: |
          set -euo pipefail
          jar tf boot/build/libs/pawbridge-backend-app.jar > build/ci/boot-jar-contents.txt
          if grep -E '(^|/)(archunit|gradle-test-kit|junit|junit-platform|hibernate|spring-data-jpa|spring-data-redis|spring-cloud|feign)[^/]*\.jar$|f[0-9]+_fixture|compatibilityTest|com/pawbridge/backend/compatibility/|com/pawbridge/[a-z]+service/' build/ci/boot-jar-contents.txt \
            | grep -Ev '^BOOT-INF/lib/(hibernate-validator-[0-9][^/]*|spring-data-redis-3[.]4[.]11|feign-(core|form)-13[.]5|hibernate-core-6[.]6[.]33[.]Final|hibernate-commons-annotations-7[.]0[.]3[.]Final|spring-data-jpa-3[.]4[.]11)\.jar$'; then
            printf 'Test or compatibility code must not enter the application JAR\n' >&2
            exit 1
          fi

      - name: Share only this run's exact candidate JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-app-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend-app/boot/build/libs/pawbridge-backend-app.jar
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7

      - name: Preserve shared unit and architecture evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-app-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend-app/**/build/test-results/**/TEST-*.xml
            backend-app/build/ci/runtime-metadata.txt
            backend-app/build/ci/gradle-version.txt
            backend-app/build/ci/boot-jar.sha256
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7

  check:
    needs: [selection, proof, package]
    if: ${{ github.event_name != 'pull_request' && needs.selection.outputs.selected == 'true' && needs.proof.outputs.mode == 'execute' }}
    name: ${{ matrix.profile == 'full' && 'Java 21 build and isolated PostgreSQL/S3 HTTP contracts' || 'F25 six-smoke pilot with the same candidate JAR' }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.selection.outputs.profiles) }}
    env:
      PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
      CONTRACT_PROFILE: ${{ matrix.profile }}
      EXPECTED_CANDIDATE_JAR_SHA256: ${{ needs.package.outputs.jar_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: backend-app
    steps:
      - name: Check out candidate and pinned fixture DDL Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            backend-app
            .github/workflows/backend-app-check.yml
            .github/scripts/backend_contract_profile.py
            .github/scripts/ci_branch_policy.py
            user-service/src/migration/resources/db/postgresql/V4__auth_sessions.sql
            user-service/src/migration/resources/db/postgresql/V5__drop_refresh_tokens.sql
          sparse-checkout-cone-mode: false

      - name: Require the immutable F21 original-source Git object
        env:
          F21_PINNED_SOURCE: d436e3c43fa220cd4004d9f39040f809915ec6ae
          F21_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$F21_PINNED_SOURCE^{commit}" 2>/dev/null; then
            source_auth=$(printf 'x-access-token:%s' "$F21_SOURCE_READ_TOKEN" | base64 | tr -d '\n')
            printf '::add-mask::%s\n' "$source_auth"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $source_auth" \
              git fetch --no-tags --no-recurse-submodules --depth=1 origin "$F21_PINNED_SOURCE"
          fi
          git cat-file -e "$F21_PINNED_SOURCE^{commit}"

      - name: Require the immutable F22 original-source Git object
        env:
          F22_PINNED_SOURCE: cba94f898399674d4f708ce0c01e2192a18bc6c7
          F22_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$F22_PINNED_SOURCE^{commit}" 2>/dev/null; then
            source_auth=$(printf 'x-access-token:%s' "$F22_SOURCE_READ_TOKEN" | base64 | tr -d '\n')
            printf '::add-mask::%s\n' "$source_auth"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $source_auth" \
              git fetch --no-tags --no-recurse-submodules --depth=1 origin "$F22_PINNED_SOURCE"
          fi
          git cat-file -e "$F22_PINNED_SOURCE^{commit}"

      - name: Require the immutable F23 original-source Git object
        env:
          F23_PINNED_SOURCE: f06a72a06bd26662c647bde780dfc7a27bf7349c
          F23_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$F23_PINNED_SOURCE^{commit}" 2>/dev/null; then
            source_auth=$(printf 'x-access-token:%s' "$F23_SOURCE_READ_TOKEN" | base64 | tr -d '\n')
            printf '::add-mask::%s\n' "$source_auth"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $source_auth" \
              git fetch --no-tags --no-recurse-submodules --depth=1 origin "$F23_PINNED_SOURCE"
          fi
          git cat-file -e "$F23_PINNED_SOURCE^{commit}"

      - name: Require F24 to reuse the immutable F23 original-source Git object
        run: git cat-file -e 'f06a72a06bd26662c647bde780dfc7a27bf7349c^{commit}'

      - name: Require F25 to reuse the immutable F23 original-source Git object
        run: git cat-file -e 'f06a72a06bd26662c647bde780dfc7a27bf7349c^{commit}'

      - name: Require F26 to reuse the immutable F23 original-source Git object
        run: git cat-file -e 'f06a72a06bd26662c647bde780dfc7a27bf7349c^{commit}'

      - name: Require F27 to reuse the immutable F23 original-source Git object
        run: git cat-file -e 'f06a72a06bd26662c647bde780dfc7a27bf7349c^{commit}'

      - name: Require F28 to reuse the immutable F23 original-source Git object
        run: git cat-file -e 'f06a72a06bd26662c647bde780dfc7a27bf7349c^{commit}'

      - name: Require F29 to reuse the immutable F23 original-source Git object
        run: git cat-file -e 'f06a72a06bd26662c647bde780dfc7a27bf7349c^{commit}'

      - name: Isolate Gradle state on the hosted runner
        run: |
          set -euo pipefail
          printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/pawbridge-backend-app-gradle" >> "$GITHUB_ENV"

      - name: Set up Java 21
        id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          check-latest: true

      - name: Set up Gradle Wrapper validation
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
          add-job-summary-as-pr-comment: never

      - name: Record the tested runtime
        env:
          JDK_DISTRIBUTION: ${{ steps.java.outputs.distribution }}
          JDK_VERSION: ${{ steps.java.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/ci
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'runner_architecture=%s\n' "$(uname -m)"
            printf 'jdk_distribution=%s\n' "$JDK_DISTRIBUTION"
            printf 'jdk_version=%s\n' "$JDK_VERSION"
            java -version 2>&1
          } | tee build/ci/runtime-metadata.txt
          bash ./gradlew --version --no-daemon --max-workers=1 -Dorg.gradle.parallel=false | tee build/ci/gradle-version.txt
          grep -Fx 'Gradle 8.14.3' build/ci/gradle-version.txt

      - name: Verify no hosted-only helper can run outside CI
        run: |
          set -euo pipefail
          if env -u GITHUB_ACTIONS python3 scripts/f2_ci.py prepare > build/ci/helper-refusal.txt 2>&1; then
            printf 'Hosted-only fixture helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f3_ci.py prepare > build/ci/f3-helper-refusal.txt 2>&1; then
            printf 'F3 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f3-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f4_ci.py prepare > build/ci/f4-helper-refusal.txt 2>&1; then
            printf 'F4 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f4-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f5_ci.py prepare > build/ci/f5-helper-refusal.txt 2>&1; then
            printf 'F5 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f5-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f6_ci.py smoke > build/ci/f6-helper-refusal.txt 2>&1; then
            printf 'F6 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f6-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f7_ci.py prepare > build/ci/f7-helper-refusal.txt 2>&1; then
            printf 'F7 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f7-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f8_ci.py prepare > build/ci/f8-helper-refusal.txt 2>&1; then
            printf 'F8 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f8-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f9_ci.py prepare > build/ci/f9-helper-refusal.txt 2>&1; then
            printf 'F9 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f9-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f10_ci.py prepare > build/ci/f10-helper-refusal.txt 2>&1; then
            printf 'F10 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f10-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f11_ci.py prepare > build/ci/f11-helper-refusal.txt 2>&1; then
            printf 'F11 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f11-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f12_ci.py prepare > build/ci/f12-helper-refusal.txt 2>&1; then
            printf 'F12 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f12-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f13_ci.py prepare > build/ci/f13-helper-refusal.txt 2>&1; then
            printf 'F13 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f13-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f14_ci.py prepare > build/ci/f14-helper-refusal.txt 2>&1; then
            printf 'F14 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f14-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f15_ci.py prepare > build/ci/f15-helper-refusal.txt 2>&1; then
            printf 'F15 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f15-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f16_ci.py prepare > build/ci/f16-helper-refusal.txt 2>&1; then
            printf 'F16 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f16-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f17_ci.py prepare > build/ci/f17-helper-refusal.txt 2>&1; then
            printf 'F17 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f17-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f18_ci.py prepare > build/ci/f18-helper-refusal.txt 2>&1; then
            printf 'F18 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f18-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f19_ci.py prepare > build/ci/f19-helper-refusal.txt 2>&1; then
            printf 'F19 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f19-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f20_ci.py prepare > build/ci/f20-helper-refusal.txt 2>&1; then
            printf 'F20 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f20-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f21_ci.py prepare > build/ci/f21-helper-refusal.txt 2>&1; then
            printf 'F21 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f21-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f22_ci.py prepare > build/ci/f22-helper-refusal.txt 2>&1; then
            printf 'F22 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          if env -u GITHUB_ACTIONS python3 scripts/f23_ci.py prepare > build/ci/f23-helper-refusal.txt 2>&1; then
            printf 'F23 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f22-helper-refusal.txt
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f23-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f24_ci.py prepare > build/ci/f24-helper-refusal.txt 2>&1; then
            printf 'F24 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f24-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f25_ci.py prepare > build/ci/f25-helper-refusal.txt 2>&1; then
            printf 'F25 helper accepted a non-CI invocation\n' >&2
            exit 1
