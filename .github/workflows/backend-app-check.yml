          python3 scripts/f22_ci.py smoke
          test -s build/ci/f22-oracle-sha256.txt
          test -s build/ci/f22-fixture-reuse.txt
          test -s build/ci/f22-helper-refusal.txt
          python3 - <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import f22_ci as f22
          f22.require_measurements('jar')
          result = json.loads(Path('build/ci/f22-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert {key: result[key] for key in f22.COUNTERS} == f22.EXPECTED_JAR_COUNTS
          assert result['detail_get_checks'] == result['successful_checks'] + result['rejected_checks']
          assert result['database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PYTHON

      - name: Verify F23 unchanged fixture, owner, selected original and recovery guards without resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f23_ci_guards.py

      - name: Reuse the exact F22 fixture for F23 without new DDL or privileges
        run: python3 scripts/f23_ci.py prepare

      - name: Compare only F23 owned mailbox pages in UTC and one Seoul sort and timestamp case
        run: |
          set -euo pipefail
          bash ./gradlew :boot:privateNoteListCompatibilityTest :boot:privateNoteListCompatibilitySeoulTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f23_ci.py results

      - name: Verify packaged mailbox pages, separate count and list recovery and unchanged state
        id: jar_f23
        if: ${{ matrix.profile == 'full' }}
        run: |
          set -euo pipefail
          python3 scripts/f23_ci.py smoke
          test -s build/ci/f23-oracle-sha256.txt
          test -s build/ci/f23-fixture-reuse.txt
          test -s build/ci/f23-helper-refusal.txt
          python3 - <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import f23_ci as f23
          f23.require_measurements('jar')
          result = json.loads(Path('build/ci/f23-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert {key: result[key] for key in f23.COUNTERS} == f23.EXPECTED_JAR_COUNTS
          assert result['list_get_checks'] == result['successful_checks'] + result['rejected_checks']
          assert result['database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PYTHON

      - name: Verify F24 owned writer, rollback, recovery and selected original guards without resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f24_ci_guards.py

      - name: Extend only the existing member lock and outgoing block writer privileges for F24
        run: python3 scripts/f24_ci.py prepare

      - name: Compare only F24 owned unblock transactions and measured original MVC in UTC
        run: |
          set -euo pipefail
          bash ./gradlew :boot:noteBlockRemoveCompatibilityTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f24_ci.py results

      - name: Verify packaged unblock, exact permitted writes and protected state recovery
        id: jar_f24
        run: |
          set -euo pipefail
          python3 scripts/f24_ci.py smoke
          test -s build/ci/f24-oracle-sha256.txt
          test -s build/ci/f24-fixture-write.txt
          test -s build/ci/f24-helper-refusal.txt
          python3 - <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import f24_ci as f24
          f24.require_measurements()
          result = json.loads(Path('build/ci/f24-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert {key: result[key] for key in f24.COUNTERS} == f24.EXPECTED_JAR_COUNTS
          assert result['delete_checks'] == result['successful_delete_checks'] + result['rejected_delete_checks']
          assert result['protected_database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PYTHON

      - name: Verify F25 block creation ownership, selected original and recovery guards without resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f25_ci_guards.py

      - name: Extend only the outgoing block INSERT columns for F25
        run: python3 scripts/f25_ci.py prepare

      - name: Compare F25 owned block creation in UTC and only timestamp preservation in Seoul
        run: |
          set -euo pipefail
          bash ./gradlew :boot:noteBlockCreateCompatibilityTest :boot:noteBlockCreateCompatibilitySeoulTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false

      - name: Require exact F25 measured UTC and thin Seoul reports
        run: python3 scripts/f25_ci.py results

      - name: Verify packaged block creation, duplicate timestamps and protected state recovery
        id: jar_f25
        run: |
          set -euo pipefail
          python3 scripts/f25_ci.py smoke
          test -s build/ci/f25-oracle-sha256.txt
          test -s build/ci/f25-fixture-write.txt
          test -s build/ci/f25-helper-refusal.txt
          python3 - <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import f25_ci as f25
          f25.require_measurements()
          result = json.loads(Path('build/ci/f25-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert {key: result[key] for key in f25.COUNTERS} == f25.EXPECTED_JAR_COUNTS
          assert result['put_checks'] == result['successful_put_checks'] + result['rejected_put_checks']
          assert result['request_checks'] == result['put_checks'] + result['get_checks'] + result['delete_checks']
          assert result['protected_database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PYTHON

      - name: Remove only the owned disposable fixture
        id: owned_cleanup
        if: always()
        run: python3 scripts/f3_ci.py cleanup

      - name: Reject missing, failed or falsely skipped runtime contracts
        if: always()
        env:
          CONTRACT_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          test "$(sha256sum boot/build/libs/pawbridge-backend-app.jar | cut -d ' ' -f 1)" = "$EXPECTED_CANDIDATE_JAR_SHA256"
          python3 ../.github/scripts/backend_contract_profile.py --mode audit --profile "$CONTRACT_PROFILE" \
            --jar boot/build/libs/pawbridge-backend-app.jar --plan build/ci/contract-plan.txt \
            --execution build/ci/contract-execution.txt

      - name: Preserve tests and bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-app-check-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          path: |
            backend-app/**/build/test-results/**/TEST-*.xml
            backend-app/build/ci/*.txt
            backend-app/build/ci/*.log
            backend-app/build/ci/f24-results.json
            backend-app/build/ci/f25-results.json
            backend-app/build/ci/boot-jar.sha256
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7

      - name: Preserve the verified executable JAR
        if: ${{ success() && matrix.profile == 'full' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-app-boot-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend-app/boot/build/libs/pawbridge-backend-app.jar
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7

  ci-result:
    name: Backend app CI result
    needs: [selection, package, check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the selected application check to succeed
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          MODULE_SELECTED: ${{ needs.selection.outputs.selected }}
          MODULE_RESULT: ${{ needs.check.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          test "$SELECTION_RESULT" = success
          case "$MODULE_SELECTED:$PACKAGE_RESULT:$MODULE_RESULT" in
            true:success:success|false:skipped:skipped) ;;
            *) printf 'Backend app checks failed or were unexpectedly skipped\n' >&2; exit 1 ;;
          esac
