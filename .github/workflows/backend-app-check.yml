name: Backend app check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select backend app validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.selection.outputs.selected }}
    steps:
      - name: Check out source for selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select application and CI policy changes
        id: selection
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          sys.path.insert(0, ".github/scripts")
          from ci_branch_policy import changed_paths, validate_event

          paths = changed_paths(os.environ, validate_event(os.environ))
          selected = any(
              path.startswith("backend-app/")
              or path in {
                  ".github/workflows/backend-app-check.yml",
                  ".github/scripts/test_backend_app_ci_policy.py",
                  ".github/scripts/ci_branch_policy.py",
              }
              for path in paths
          )
          print("selected=" + str(selected).lower())
          PY

  check:
    needs: selection
    if: ${{ needs.selection.outputs.selected == 'true' }}
    name: Java 21 build and isolated PostgreSQL/S3 HTTP contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend-app
    steps:
      - name: Check out candidate and pinned legacy Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            backend-app
            .github/workflows/backend-app-check.yml
          sparse-checkout-cone-mode: false

      - name: Isolate Gradle state on the hosted runner
        run: |
          set -euo pipefail
          printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/pawbridge-backend-app-gradle" >> "$GITHUB_ENV"

      - name: Set up Java 21
        id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          check-latest: true

      - name: Set up Gradle Wrapper validation
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
          add-job-summary-as-pr-comment: never

      - name: Record the tested runtime
        env:
          JDK_DISTRIBUTION: ${{ steps.java.outputs.distribution }}
          JDK_VERSION: ${{ steps.java.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/ci
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'runner_architecture=%s\n' "$(uname -m)"
            printf 'jdk_distribution=%s\n' "$JDK_DISTRIBUTION"
            printf 'jdk_version=%s\n' "$JDK_VERSION"
            java -version 2>&1
          } | tee build/ci/runtime-metadata.txt
          bash ./gradlew --version --no-daemon --max-workers=1 -Dorg.gradle.parallel=false | tee build/ci/gradle-version.txt
          grep -Fx 'Gradle 8.14.3' build/ci/gradle-version.txt

      - name: Verify no hosted-only helper can run outside CI
        run: |
          set -euo pipefail
          if env -u GITHUB_ACTIONS python3 scripts/f2_ci.py prepare > build/ci/helper-refusal.txt 2>&1; then
            printf 'Hosted-only fixture helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f3_ci.py prepare > build/ci/f3-helper-refusal.txt 2>&1; then
            printf 'F3 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f3-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f4_ci.py prepare > build/ci/f4-helper-refusal.txt 2>&1; then
            printf 'F4 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f4-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f5_ci.py prepare > build/ci/f5-helper-refusal.txt 2>&1; then
            printf 'F5 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f5-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f6_ci.py smoke > build/ci/f6-helper-refusal.txt 2>&1; then
            printf 'F6 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f6-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f7_ci.py prepare > build/ci/f7-helper-refusal.txt 2>&1; then
            printf 'F7 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f7-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f8_ci.py prepare > build/ci/f8-helper-refusal.txt 2>&1; then
            printf 'F8 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f8-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f9_ci.py prepare > build/ci/f9-helper-refusal.txt 2>&1; then
            printf 'F9 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f9-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f10_ci.py prepare > build/ci/f10-helper-refusal.txt 2>&1; then
            printf 'F10 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f10-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f11_ci.py prepare > build/ci/f11-helper-refusal.txt 2>&1; then
            printf 'F11 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f11-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f12_ci.py prepare > build/ci/f12-helper-refusal.txt 2>&1; then
            printf 'F12 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f12-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f13_ci.py prepare > build/ci/f13-helper-refusal.txt 2>&1; then
            printf 'F13 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f13-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f14_ci.py prepare > build/ci/f14-helper-refusal.txt 2>&1; then
            printf 'F14 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f14-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f15_ci.py prepare > build/ci/f15-helper-refusal.txt 2>&1; then
            printf 'F15 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f15-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f16_ci.py prepare > build/ci/f16-helper-refusal.txt 2>&1; then
            printf 'F16 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f16-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f17_ci.py prepare > build/ci/f17-helper-refusal.txt 2>&1; then
            printf 'F17 helper accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f17-helper-refusal.txt
          if env -u GITHUB_ACTIONS python3 scripts/f3_s3_stub.py > build/ci/f3-stub-refusal.txt 2>&1; then
            printf 'F3 stub accepted a non-CI invocation\n' >&2
            exit 1
          fi
          grep -F 'restricted to this repository on GitHub-hosted Linux' build/ci/f3-stub-refusal.txt

      - name: Check modules, boundaries, unit tests and executable JAR
        run: |
          set -euo pipefail
          bash ./gradlew projects check :boot:bootJar --no-daemon --max-workers=1 -Dorg.gradle.parallel=false

      - name: Prepare owned synthetic PostgreSQL 17
        run: |
          set -euo pipefail
          python3 scripts/f2_ci.py prepare

      - name: Extend the same owned PostgreSQL with F3 writer fixture
        run: python3 scripts/f3_ci.py prepare

      - name: Extend the same owned PostgreSQL with F4 timestamp and search-delete permissions
        run: python3 scripts/f4_ci.py prepare

      - name: Extend the same owned PostgreSQL with F5 partial-update permissions
        run: python3 scripts/f5_ci.py prepare

      - name: Grant only five search projection columns to the existing reader
        run: python3 scripts/f7_ci.py prepare

      - name: Verify F8 ownership, fixture and oracle guards without starting resources
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f8_ci_guards.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f8_s3_observation.py

      - name: Extend the owned fixture with only the comment table and reader columns
        run: python3 scripts/f8_ci.py prepare

      - name: Verify F9 fixture, oracle and workflow guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f9_ci_guards.py

      - name: Extend the owned fixture with minimal F9 comment INSERT permissions
        run: python3 scripts/f9_ci.py prepare

      - name: Compare legacy reads/writes, issuer, atomicity and resource boundaries in UTC and Seoul
        run: |
          set -euo pipefail
          bash ./gradlew :boot:compatibilityTest :boot:compatibilitySeoulTest             --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          bash ./gradlew :boot:dependencies --configuration compatibilityTestRuntimeClasspath             --no-daemon --max-workers=1 -Dorg.gradle.parallel=false > build/ci/compatibility-dependencies.txt
          bash ./gradlew :boot:dependencies --configuration runtimeClasspath --no-daemon --max-workers=1 -Dorg.gradle.parallel=false > build/ci/f3-runtime-dependencies.txt

      - name: Verify production JAR isolation
        run: |
          set -euo pipefail
          jar tf boot/build/libs/pawbridge-backend-app.jar > build/ci/boot-jar-contents.txt
          if grep -E '(^|/)(archunit|gradle-test-kit|junit|junit-platform|hibernate|spring-data-jpa|spring-data-redis|spring-cloud|feign)[^/]*\.jar$|f[23456789]_fixture|f10_fixture|f11_fixture|f12_fixture|f13_fixture|f14_fixture|f15_fixture|f16_fixture|f17_fixture|f[23456789]LegacyOracle|f10LegacyOracle|f11LegacyOracle|f12LegacyOracle|f13LegacyOracle|f14LegacyOracle|f15LegacyOracle|f16LegacyOracle|f17LegacyOracle|compatibilityTest|com/pawbridge/backend/compatibility/|com/pawbridge/(communityservice|userservice)/' build/ci/boot-jar-contents.txt \
            | grep -Ev '^BOOT-INF/lib/hibernate-validator-[0-9][^/]*\.jar$'; then
            printf 'Test/legacy/integration code must not enter the application JAR\n' >&2
            exit 1
          fi
          sha256sum boot/build/libs/pawbridge-backend-app.jar > build/ci/boot-jar.sha256

      - name: Verify packaged POST/GET, synthetic SDK uploads, failures and normal termination
        run: python3 scripts/f3_ci.py smoke

      - name: Verify F4 listener startup with socket and process mocks only
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f4_ci_startup.py

      - name: Verify packaged owner deletion, best-effort storage and rollback recovery
        run: python3 scripts/f4_ci.py smoke

      - name: Verify packaged owner PUT, SDK replacement and failure recovery
        run: python3 scripts/f5_ci.py smoke

      - name: Verify F6 ownership and oracle guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f6_ci_guards.py

      - name: Verify packaged public list journey, per-GET zero writes and recovery
        run: |
          set -euo pipefail
          python3 scripts/f6_ci.py smoke
          test -s build/ci/f6-oracle-sha256.txt
          test -s build/ci/f6-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f6-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['list_get_checks'] >= 10
          assert result['list_get_database_changes'] == result['list_get_s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify F7 grants and oracle guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f7_ci_guards.py

      - name: Verify packaged public search journey, per-GET zero writes and recovery
        run: |
          set -euo pipefail
          python3 scripts/f7_ci.py smoke
          test -s build/ci/f7-oracle-sha256.txt
          test -s build/ci/f7-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f7-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['search_get_checks'] >= 14
          assert result['search_get_database_changes'] == result['search_get_s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify packaged public comment reads, denied writes, zero side effects and recovery
        run: |
          set -euo pipefail
          python3 scripts/f8_ci.py smoke
          test -s build/ci/f8-oracle-sha256.txt
          test -s build/ci/f8-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f8-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['comment_get_checks'] >= 9
          assert result['denied_route_checks'] == 10
          assert result['comment_get_database_changes'] == result['comment_get_s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify packaged authenticated comment POST, F8 GET and isolated rollback recovery
        run: |
          set -euo pipefail
          python3 scripts/f9_ci.py smoke
          test -s build/ci/f9-oracle-sha256.txt
          test -s build/ci/f9-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f9-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['comments_created'] >= 15
          assert result['rejected_post_checks'] >= 28
          assert result['comment_post_checks'] == result['comments_created'] + result['rejected_post_checks']
          assert result['comment_get_checks'] >= result['comments_created']
          assert result['unrelated_database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify F10 staged ownership, ACL, report and workflow guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f10_ci_guards.py

      - name: Extend the owned fixture with exact F10 comment deletion permissions
        run: python3 scripts/f10_ci.py prepare

      - name: Compare only F10 comment deletion in UTC and Seoul with the extended ACL
        run: |
          set -euo pipefail
          bash ./gradlew :boot:commentDeleteCompatibilityTest :boot:commentDeleteCompatibilitySeoulTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f10_ci.py results

      - name: Verify packaged authenticated comment deletion, preserved rows and rollback recovery
        run: |
          set -euo pipefail
          python3 scripts/f10_ci.py smoke
          test -s build/ci/f8-oracle-sha256.txt
          test -s build/ci/f10-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f10-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['comment_post_checks'] >= 10
          assert result['comment_get_checks'] >= 20
          assert result['comments_deleted'] >= 10
          assert result['rejected_delete_checks'] >= 25
          assert result['comment_delete_checks'] == result['comments_deleted'] + result['rejected_delete_checks']
          assert result['unrelated_database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify F11 staged ownership, ACL, report and oracle guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f11_ci_guards.py

      - name: Extend the owned fixture with exact F11 comment content update permission
        run: python3 scripts/f11_ci.py prepare

      - name: Compare only F11 comment update in UTC and Seoul with the extended ACL
        run: |
          set -euo pipefail
          bash ./gradlew :boot:commentUpdateCompatibilityTest :boot:commentUpdateCompatibilitySeoulTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f11_ci.py results

      - name: Verify packaged comment PUT, old response timestamps, no-op writes and rollback recovery
        run: |
          set -euo pipefail
          python3 scripts/f11_ci.py smoke
          test -s build/ci/f11-oracle-sha256.txt
          test -s build/ci/f11-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f11-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['comment_post_checks'] >= 3
          assert result['comment_get_checks'] >= 40
          assert result['comment_delete_checks'] >= 1
          assert result['changed_put_checks'] >= 10
          assert result['same_put_checks'] >= 6
          assert result['rejected_put_checks'] >= 28
          assert result['comment_put_checks'] == result['changed_put_checks'] + result['same_put_checks'] + result['rejected_put_checks']
          assert result['unrelated_database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify F12 staged fixture, identity, projection, oracle and workflow guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f12_ci_guards.py

      - name: Extend the owned fixture with exact F12 profile columns and reader permissions
        run: python3 scripts/f12_ci.py prepare

      - name: Compare only F12 profile reads in UTC and Seoul after the owned User fixture extension
        run: |
          set -euo pipefail
          bash ./gradlew :boot:profileCompatibilityTest :boot:profileCompatibilitySeoulTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f12_ci.py results

      - name: Verify packaged authenticated profile reads, private-column exclusion and recovery
        run: |
          set -euo pipefail
          python3 scripts/f12_ci.py smoke
          test -s build/ci/f12-oracle-sha256.txt
          test -s build/ci/f12-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f12-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['successful_profile_checks'] >= 17
          assert result['rejected_profile_checks'] >= 15
          assert result['profile_get_checks'] == result['successful_profile_checks'] + result['rejected_profile_checks']
          assert result['denied_route_checks'] >= 10
          assert result['database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify F13 staged target, column ACL, pinned migration, reports and token guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f13_ci_guards.py

      - name: Extend the owned fixture with pinned User constraints and exact F13 nickname permissions
        run: python3 scripts/f13_ci.py prepare

      - name: Compare only F13 nickname writes in UTC and Seoul after the owned User writer extension
        run: |
          set -euo pipefail
          bash ./gradlew :boot:nicknameCompatibilityTest :boot:nicknameCompatibilitySeoulTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f13_ci.py results

      - name: Verify packaged nickname PUT, profile and Community visibility, no-op and recovery
        run: |
          set -euo pipefail
          python3 scripts/f13_ci.py smoke
          test -s build/ci/f13-oracle-sha256.txt
          test -s build/ci/f13-ddl-sha256.txt
          test -s build/ci/f13-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f13-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['changed_put_checks'] >= 3
          assert result['same_put_checks'] >= 3
          assert result['rejected_put_checks'] >= 20
          assert result['nickname_put_checks'] == result['changed_put_checks'] + result['same_put_checks'] + result['rejected_put_checks']
          assert result['profile_get_checks'] >= 6
          assert result['community_get_checks'] == result['profile_get_checks']
          assert result['unrelated_database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify F14 target, pinned schema, two-column ACL, oracle, reports and token guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f14_ci_guards.py

      - name: Extend the owned fixture with exact F14 favorites schema and reader-only columns
        run: python3 scripts/f14_ci.py prepare

      - name: Compare only F14 favorite status in UTC after the owned favorites fixture extension
        run: |
          set -euo pipefail
          bash ./gradlew :boot:favoriteStatusCompatibilityTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f14_ci.py results

      - name: Verify packaged favorite Boolean GET, missing-user false, no side effects and permission recovery
        run: |
          set -euo pipefail
          python3 scripts/f14_ci.py smoke
          test -s build/ci/f14-oracle-sha256.txt
          test -s build/ci/f14-ddl-sha256.txt
          test -s build/ci/f14-helper-refusal.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f14-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['true_checks'] >= 3
          assert result['false_checks'] >= 3
          assert result['rejected_get_checks'] >= 5
          assert result['favorite_get_checks'] == result['true_checks'] + result['false_checks'] + result['rejected_get_checks']
          assert result['database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PY

      - name: Verify F15 owner, full V9, exact ACL, oracle and report guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f15_ci_guards.py

      - name: Extend the owned fixture with pinned F15 board and videos and reader-only columns
        run: python3 scripts/f15_ci.py prepare

      - name: Compare only F15 home videos in UTC and Seoul after the owned V9 fixture extension
        run: |
          set -euo pipefail
          bash ./gradlew :boot:homeVideoCompatibilityTest :boot:homeVideoCompatibilitySeoulTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f15_ci.py results

      - name: Verify packaged public home videos, expiry, permission recovery and no side effects
        run: |
          set -euo pipefail
          python3 scripts/f15_ci.py smoke
          test -s build/ci/f15-oracle-sha256.txt
          test -s build/ci/f15-ddl-sha256.txt
          test -s build/ci/f15-helper-refusal.txt
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f15-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['nonempty_checks'] == 3
          assert result['empty_checks'] == 1
          assert result['unavailable_checks'] == 1
          assert result['malformed_bearer_checks'] == 1
          assert result['home_get_checks'] == result['nonempty_checks'] + result['empty_checks'] + result['unavailable_checks']
          assert result['database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PYTHON

      - name: Verify F16 fixture, date window, reports, oracle and cleanup guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f16_ci_guards.py

      - name: Extend the owned fixture with only pinned F16 daily totals and reader columns
        run: python3 scripts/f16_ci.py prepare

      - name: Compare F16 date binding in UTC and Seoul and access and original MVC once
        run: |
          set -euo pipefail
          bash ./gradlew :boot:visitTodayCompatibilityTest :boot:visitTodayCompatibilitySeoulTest :boot:visitTodayLegacyMvcTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f16_ci.py results

      - name: Verify packaged enabled totals and one disabled404 phase without JWT refresh
        run: |
          set -euo pipefail
          python3 scripts/f16_ci.py smoke
          test -s build/ci/f16-oracle-sha256.txt
          test -s build/ci/f16-ddl-sha256.txt
          test -s build/ci/f16-helper-refusal.txt
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f16-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          enabled, disabled = result['enabled'], result['disabled']
          assert enabled['visit_get_checks'] == 5
          assert enabled['positive_checks'] == 3
          assert enabled['zero_checks'] == enabled['unavailable_checks'] == enabled['malformed_bearer_checks'] == 1
          assert disabled['visit_get_checks'] == disabled['disabled_404_checks'] == 1
          assert 'Boot tests only' in result['disabled_evidence']
          for phase in (enabled, disabled):
              assert phase['status'] == 'passed'
              assert phase['shutdown_pools'] == 2
              assert phase['remaining_application_connections'] == 0
          assert result['database_changes'] == result['s3_requests'] == 0
          PYTHON

      - name: Verify F17 staged ownership, minimal ACL, pinned source, token and report guards without starting resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_f17_ci_guards.py

      - name: Extend the owned fixture with only F17 pending and block tables and three reader columns
        run: python3 scripts/f17_ci.py prepare

      - name: Compare F17 recipients and lightweight original lookup boundaries once in UTC
        run: |
          set -euo pipefail
          bash ./gradlew :boot:noteRecipientCompatibilityTest \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false
          python3 scripts/f17_ci.py results

      - name: Verify packaged note recipients, source-specific SQL recovery and unchanged business snapshots
        run: |
          set -euo pipefail
          python3 scripts/f17_ci.py smoke
          test -s build/ci/f17-oracle-sha256.txt
          test -s build/ci/f17-ddl-sha256.txt
          test -s build/ci/f17-helper-refusal.txt
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          result = json.loads(Path('build/ci/f17-packaged-result.txt').read_text())
          assert result['status'] == 'passed'
          assert result['recipient_get_checks'] == 16
          assert result['successful_checks'] == 4
          assert result['rejected_checks'] == 12
          assert result['recipient_get_checks'] == result['successful_checks'] + result['rejected_checks']
          assert result['denied_route_checks'] == 2
          assert result['database_changes'] == result['s3_requests'] == 0
          assert result['shutdown_pools'] == 2
          assert result['remaining_application_connections'] == 0
          PYTHON

      - name: Remove only the owned disposable fixture
        if: always()
        run: python3 scripts/f3_ci.py cleanup

      - name: Preserve tests and bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-app-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend-app/**/build/test-results/**/TEST-*.xml
            backend-app/build/ci/*.txt
            backend-app/build/ci/*.log
            backend-app/build/ci/boot-jar.sha256
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7

      - name: Preserve the verified executable JAR
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-app-boot-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend-app/boot/build/libs/pawbridge-backend-app.jar
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7

  ci-result:
    name: Backend app CI result
    needs: [selection, check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the selected application check to succeed
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          MODULE_SELECTED: ${{ needs.selection.outputs.selected }}
          MODULE_RESULT: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          test "$SELECTION_RESULT" = success
          case "$MODULE_SELECTED:$MODULE_RESULT" in
            true:success|false:skipped) ;;
            *) printf 'Backend app checks failed or were unexpectedly skipped\n' >&2; exit 1 ;;
          esac
