  ci-result:
    name: Backend app CI result
    needs: [selection, proof, package, check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the selected application check to succeed
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          MODULE_SELECTED: ${{ needs.selection.outputs.selected }}
          MODULE_RESULT: ${{ needs.check.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PROOF_RESULT: ${{ needs.proof.result }}
          PROOF_MODE: ${{ needs.proof.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$SELECTION_RESULT" = success
          # Pull requests stop after the shared package; PostgreSQL contracts run on dev pushes.
          executed=success
          if [ "$EVENT_NAME" = pull_request ]; then
            executed=skipped
          fi
          case "$MODULE_SELECTED:$PROOF_RESULT:$PROOF_MODE:$PACKAGE_RESULT:$MODULE_RESULT" in
            "true:success:execute:success:$executed"|true:success:reused-full:skipped:skipped|false:skipped::skipped:skipped) ;;
            *) printf 'Backend app checks failed or were unexpectedly skipped\n' >&2; exit 1 ;;
          esac
