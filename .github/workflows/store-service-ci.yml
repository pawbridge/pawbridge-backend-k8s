name: Store Service CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - "store-service/**"
      - ".github/workflows/store-service-ci.yml"

permissions:
  contents: read

concurrency:
  group: store-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Store Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: store-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build executable JAR
        run: bash ./gradlew test bootJar --no-daemon

      - name: Validate Store Service container image build
        run: docker build --tag "pawbridge-store-service:ci-${GITHUB_SHA}" .
