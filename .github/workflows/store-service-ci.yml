name: Store Service CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - "store-service/**"
      - ".github/workflows/store-service-ci.yml"

permissions:
  contents: read

concurrency:
  group: store-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Store Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/pawbridge_store
      SPRING_DATASOURCE_USERNAME: pawbridge_ci
      SPRING_DATASOURCE_PASSWORD: ci_only_password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pawbridge_store
          MYSQL_USER: pawbridge_ci
          MYSQL_PASSWORD: ci_only_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -pci_only_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: store-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build executable JAR
        run: bash ./gradlew test bootJar --no-daemon

      - name: Validate Store Service container image build
        run: docker build --tag "pawbridge-store-service:ci-${GITHUB_SHA}" .
