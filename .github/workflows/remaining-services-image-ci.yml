name: Remaining Java Services Image CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      service:
        description: Service to check without publishing.
        required: true
        type: choice
        options:
          - user-service
          - animal-service
          - community-service
          - payment-service
      publish:
        description: Publication is disabled during R1; true is rejected.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: remaining-java-services-image-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-automation:
    name: Validate image-values updater
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test service image-values updater
        run: >-
          python3 -m unittest discover
          --start-directory .github/scripts
          --pattern 'test_*.py'

  selection:
    name: Detect changed Java services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.selection.outputs.selected }}
      matrix: ${{ steps.selection.outputs.matrix }}
      count: ${{ steps.selection.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: selection
        name: Select service build matrix
        env:
          MANUAL_SERVICE: ${{ inputs.service }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/ci_branch_policy.py select --group remaining >> "$GITHUB_OUTPUT"

  service-image-check:
    name: Service image check
    needs:
      - validate-automation
      - selection
    if: ${{ needs.selection.outputs.selected == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    uses: ./.github/workflows/_java-service-image.yml
    with:
      service: ${{ matrix.service }}
      publish: false

  # Frozen publication body: R4 requires a separate reviewed main release contract.
  service-image-publish:
    name: Service image publish (disabled during R1)
    needs:
      - validate-automation
      - selection
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    uses: ./.github/workflows/_java-service-image.yml
    with:
      service: ${{ matrix.service }}
      publish: false

  ci-result:
    name: Remaining Java CI result
    needs:
      - selection
      - validate-automation
      - service-image-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require selected checks and automation to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_branch_policy.py gate --check service-image-check --required validate-automation
