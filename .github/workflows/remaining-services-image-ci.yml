name: Remaining Java Services Image CI

# The old MSA Java code (user-service/, animal-service/, community-service/, payment-service/) was removed from dev; the modular monolith
# in backend-app is validated by "Backend app check". Branch protection still
# requires the "Remaining Java CI result" status, so this workflow only reports that there is
# nothing left to build. Only the schema migration SQL under
# */src/migration/resources remains in the old service directories.

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: remaining-java-services-image-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-result:
    name: Remaining Java CI result
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report that no old MSA code remains to validate
        run: echo "No old MSA service code remains on this branch; nothing to build."
