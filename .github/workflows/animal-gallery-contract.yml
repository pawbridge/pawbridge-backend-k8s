name: Animal gallery SQL contract
on:
  pull_request:
    branches: [main, dev]
    paths:
      - "animal-service/**"
      - ".github/workflows/animal-gallery-contract.yml"
permissions:
  contents: read
jobs:
  mysql-case-sensitive-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: flyway_test_guard
          MYSQL_ROOT_PASSWORD: local_flyway_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -plocal_flyway_test_only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Mark only this hosted disposable database
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: >-
          docker exec "$MYSQL_CONTAINER" mysql -uroot -plocal_flyway_test_only flyway_test_guard
          -e "CREATE TABLE guard(marker varchar(80)); INSERT INTO guard VALUES ('animal-flyway-disposable');"
      - name: Verify exact URL matching against case-insensitive MySQL columns
        working-directory: animal-service
        env:
          ANIMAL_MIGRATION_TEST_PORT: "3306"
        run: >-
          bash ./gradlew migrationMysqlTest
          --tests '*PhotoArchiveMysqlTest.gallery_compares_case_sensitive_source_paths_on_case_insensitive_mysql_columns'
          --no-daemon --max-workers=2
