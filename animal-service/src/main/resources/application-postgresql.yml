# Opt-in relational compatibility profile. No automatic DDL or Boot job launch; worker schedules are configured separately.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration
  datasource:
    url: ${ANIMAL_POSTGRESQL_JDBC_URL}
    username: ${ANIMAL_POSTGRESQL_USERNAME}
    password: ${ANIMAL_POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: pawbridge_animal
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: ${ANIMAL_POSTGRESQL_MAX_POOL_SIZE:10}
      minimum-idle: ${ANIMAL_POSTGRESQL_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pawbridge_animal
        jdbc:
          time_zone: UTC
  batch:
    jdbc:
      initialize-schema: never
      table-prefix: pawbridge_animal.BATCH_
    job:
      enabled: false
  sql:
    init:
      mode: never

pawbridge:
  animal-query:
    backend: postgresql
    analyzed-text: true
    # API pods maintain pending rows and audit exceptional document corruption.
    # Non-web batch processes do not start these schedules.
    projection-schedule-enabled: true
    projection-delay-ms: 2000
    projection-audit-delay-ms: 60000
  recommendation:
    backend: postgresql
