spring:
  application:
    name: animal-service

  profiles:
    active: dev

  # Spring Batch Settings
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # REST API로 수동 실행

  # JPA Batch Settings
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  elasticsearch:
    connection-timeout: 5s
    socket-timeout: 30s
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

# Server Settings
server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Logging Settings
logging:
  level:
    com.pawbridge.animalservice: INFO
    org.springframework.batch: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] - %msg%n"



# Python AI Service
python-ai-service:
  url: ${PYTHON_AI_SERVICE_URL}
  internal-api-key: ${PYTHON_AI_SERVICE_INTERNAL_API_KEY:}

chatbot:
  security:
    ip-hash-secret: ${CHATBOT_IP_HASH_SECRET:}
  rate-limit:
    anonymous:
      ten-minutes: ${CHATBOT_RATE_LIMIT_ANON_10M:5}
      daily: ${CHATBOT_RATE_LIMIT_ANON_DAILY:20}
    ip:
      ten-minutes: ${CHATBOT_RATE_LIMIT_IP_10M:20}
      daily: ${CHATBOT_RATE_LIMIT_IP_DAILY:100}
    global:
      daily: ${CHATBOT_RATE_LIMIT_GLOBAL_DAILY:300}

# APMS Public API Settings
apms:
  api:
    base-url: ${APMS_API_BASE_URL}
    service-key: ${APMS_API_SERVICE_KEY}

# K8s Probe 설정 (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
