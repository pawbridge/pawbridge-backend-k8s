sourceSets {
    migration
    migrationTest {
        java.srcDir rootProject.file("../infrastructure/migration-tests/java")
        compileClasspath += sourceSets.migration.output + sourceSets.main.output
        runtimeClasspath += sourceSets.migration.output + sourceSets.main.output
    }
}

configurations {
    migrationTestImplementation.extendsFrom migrationImplementation
    migrationTestImplementation.extendsFrom implementation
    migrationTestRuntimeOnly.extendsFrom migrationRuntimeOnly, runtimeOnly
}

dependencies {
    // Versions follow this service's Spring Boot BOM (3.4.11: Flyway 10.20.1).
    migrationImplementation 'org.flywaydb:flyway-core'
    migrationRuntimeOnly 'org.flywaydb:flyway-mysql'
    migrationRuntimeOnly 'com.mysql:mysql-connector-j'
    migrationRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    migrationRuntimeOnly 'org.postgresql:postgresql'
    migrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    migrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('migrationTest', Test) {
    description = 'Checks the isolated schema runner without application infrastructure.'
    group = 'verification'
    testClassesDirs = sourceSets.migrationTest.output.classesDirs
    classpath = sourceSets.migrationTest.runtimeClasspath
    useJUnitPlatform { excludeTags 'mysql', 'postgresql', 'postgresql-http' }
}

tasks.register('migrationPostgresqlTest', Test) {
    description = 'Checks PostgreSQL and 1024-dimensional schema on a guarded disposable local database.'
    group = 'verification'
    testClassesDirs = sourceSets.migrationTest.output.classesDirs
    classpath = sourceSets.migrationTest.runtimeClasspath
    useJUnitPlatform { includeTags 'postgresql' }
    maxHeapSize = '256m'
    outputs.upToDateWhen { false }
}

tasks.register('postgresqlSearchComparison', JavaExec) {
    description = 'Opt-in comparison using a bounded public fixture and guarded disposable PostgreSQL.'
    group = 'verification'
    classpath = sourceSets.migrationTest.runtimeClasspath
    mainClass = 'com.pawbridge.animalservice.migration.AnimalPostgresqlSearchComparison'
    maxHeapSize = '256m'
    if (project.hasProperty('searchFixture') && project.hasProperty('searchReport')) {
        args project.property('searchFixture'), project.property('searchReport')
        if (project.hasProperty('koreanAnalysis')) args 'nori'
    }
}

tasks.register('postgresqlSearchLoad', JavaExec) {
    description = 'Opt-in bounded public-text load rehearsal on the guarded disposable PostgreSQL only.'
    group = 'verification'
    classpath = sourceSets.migrationTest.runtimeClasspath
    mainClass = 'com.pawbridge.animalservice.migration.AnimalPostgresqlSearchLoad'
    maxHeapSize = '256m'
    if (project.hasProperty('loadFixture') && project.hasProperty('loadReport')) {
        args project.property('loadFixture'), project.property('loadReport')
    }
}

['info', 'validate', 'migrate'].each { command ->
    tasks.register("schemaPostgresql${command.capitalize()}", JavaExec) {
        group = 'database'
        description = "Runs isolated local PostgreSQL schema ${command}, without API or workers."
        classpath = sourceSets.migration.runtimeClasspath
        mainClass = 'com.pawbridge.animalservice.migration.AnimalPostgresqlMigration'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        args command
    }
}

tasks.register('migrationMysqlTest', Test) {
    description = 'Checks the runner against an explicitly supplied disposable local MySQL.'
    group = 'verification'
    testClassesDirs = sourceSets.migrationTest.output.classesDirs
    classpath = sourceSets.migrationTest.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mysql'
        excludeTags 'rehearsal', 'photo-http'
    }
    outputs.upToDateWhen { false }
}

tasks.register('migrationRehearsal', Test) {
    description = 'Opt-in existing-schema adoption drill; not part of check or migrationMysqlTest.'
    group = 'verification'
    testClassesDirs = sourceSets.migrationTest.output.classesDirs
    classpath = sourceSets.migrationTest.runtimeClasspath
    useJUnitPlatform { includeTags 'rehearsal' }
    outputs.upToDateWhen { false }
}

tasks.named('check') { dependsOn tasks.named('migrationTest') }

['inspect', 'info', 'validate', 'migrate'].each { command ->
    tasks.register("schema${command.capitalize()}", JavaExec) {
        group = 'database'
        description = "Runs animal schema ${command} without starting Spring Boot."
        classpath = sourceSets.migration.runtimeClasspath
        mainClass = 'com.pawbridge.animalservice.migration.AnimalSchemaMigration'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        args command
    }
}

tasks.register('migrationJar', Jar) {
    archiveClassifier = 'migration'
    // The API Dockerfile copies build/libs/*.jar. Never put this tool there.
    destinationDirectory = layout.buildDirectory.dir('migration-artifacts')
    from sourceSets.migration.output
    manifest { attributes 'Main-Class': 'com.pawbridge.animalservice.migration.AnimalSchemaMigration' }
}

tasks.register('migrationDistribution', Sync) {
    description = 'Packages the standalone runner and its dependencies for a future migration Job.'
    into layout.buildDirectory.dir('migration')
    from(tasks.named('migrationJar')) { into 'lib' }
    from(configurations.migrationRuntimeClasspath) { into 'lib' }
}

// Opt-in: a guarded disposable MySQL plus the separately built photo optimizer.
tasks.register('photoArchiveIntegrationTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.migrationTest.output.classesDirs
    classpath = sourceSets.migrationTest.runtimeClasspath
    useJUnitPlatform { includeTags 'photo-http' }
    outputs.upToDateWhen { false }
}

// Full HTTP/ORM workflows; requires a guarded disposable database.
tasks.register('migrationPostgresqlHttpTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.migrationTest.output.classesDirs
    classpath = sourceSets.migrationTest.runtimeClasspath
    useJUnitPlatform { includeTags 'postgresql-http' }
    maxHeapSize = '384m'
    outputs.upToDateWhen { false }
}
