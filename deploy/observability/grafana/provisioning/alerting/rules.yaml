# Generated by scripts/prom-rules-to-grafana.rb from prometheus/rules/urgent.yml, prometheus/rules/warning.yml — edit the Prometheus rule files, then regenerate.
---
apiVersion: 1
groups:
- orgId: 1
  name: pawbridge-urgent
  folder: PawBridge
  interval: 1m
  rules:
  - uid: pb-servicedown
    title: ServiceDown
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (up{job="pawbridge-monolith"} == 0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: up{job="pawbridge-monolith"} == 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 120s
    labels:
      severity: urgent
      source_group: pawbridge-urgent
    annotations:
      summary: monolith 다운 ({{ $labels.instance }})
      description: pawbridge-monolith scrape 가 2분 넘게 실패 중이다. 컨테이너 상태/로그(Grafana Loki)를
        확인할 것.
    isPaused: false
  - uid: pb-paymentcompensationopen
    title: PaymentCompensationOpen
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (pawbridge_payment_compensation_open{job="pawbridge-monolith"}
          > 0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: pawbridge_payment_compensation_open{job="pawbridge-monolith"} > 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 60s
    labels:
      severity: urgent
      source_group: pawbridge-urgent
    annotations:
      summary: 미처리 결제 보상 {{ $values.B.Value }}건
      description: pawbridge_payment_compensation_open > 0 이 1분 이상 지속됨. 결제 보상 처리 상태를
        즉시 확인할 것.
    isPaused: false
  - uid: pb-databaseconnectiontimeouts
    title: DatabaseConnectionTimeouts
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (increase(hikaricp_connections_timeout_total{job="pawbridge-monolith"}[2m])
          > 0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: increase(hikaricp_connections_timeout_total{job="pawbridge-monolith"}[2m])
          > 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 120s
    labels:
      severity: urgent
      source_group: pawbridge-urgent
    annotations:
      summary: DB 커넥션 획득 timeout 지속 ({{ $labels.pool }})
      description: 2분 이상 Hikari connection timeout 이 발생 중이다. Postgres 다운/과부하/풀 고갈
        가능성.
    isPaused: false
- orgId: 1
  name: pawbridge-warning
  folder: PawBridge
  interval: 1m
  rules:
  - uid: pb-high5xxratio
    title: High5xxRatio
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: |-
          group without () (sum(rate(http_server_requests_seconds_count{job="pawbridge-monolith", status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{job="pawbridge-monolith"}[5m]))
            > 0.01)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: |-
          sum(rate(http_server_requests_seconds_count{job="pawbridge-monolith", status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{job="pawbridge-monolith"}[5m]))
            > 0.01
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 300s
    labels:
      severity: warning
      source_group: pawbridge-warning
    annotations:
      summary: HTTP 5xx 비율 {{ $values.B.Value | humanizePercentage }}
      description: 최근 5분 5xx 응답 비율이 1% 를 넘었다.
    isPaused: false
  - uid: pb-highp95latency
    title: HighP95Latency
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: |-
          group without () (histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="pawbridge-monolith", uri!~"/actuator.*|/api/v1/notes/stream|/error"}[5m]))
          ) > 1)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: |-
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="pawbridge-monolith", uri!~"/actuator.*|/api/v1/notes/stream|/error"}[5m]))
          ) > 1
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 600s
    labels:
      severity: warning
      source_group: pawbridge-warning
    annotations:
      summary: HTTP p95 지연 {{ $values.B.Value | humanizeDuration }}
      description: 최근 5분 p95 응답 시간이 1초를 넘는 상태가 10분 지속됨.
    isPaused: false
  - uid: pb-hikaripoolpending
    title: HikariPoolPending
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (hikaricp_connections_pending{job="pawbridge-monolith"}
          > 0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: hikaricp_connections_pending{job="pawbridge-monolith"} > 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 300s
    labels:
      severity: warning
      source_group: pawbridge-warning
    annotations:
      summary: Hikari 풀 대기 스레드 {{ $values.B.Value }}개 ({{ $labels.pool }})
      description: 커넥션 획득을 기다리는 스레드가 5분 이상 있다. 느린 쿼리/풀 크기 부족을 의심.
    isPaused: false
  - uid: pb-hikaripoolsaturated
    title: HikariPoolSaturated
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (hikaricp_connections_active{job="pawbridge-monolith"}
          >= hikaricp_connections_max{job="pawbridge-monolith"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: hikaricp_connections_active{job="pawbridge-monolith"} >= hikaricp_connections_max{job="pawbridge-monolith"}
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 120s
    labels:
      severity: warning
      source_group: pawbridge-warning
    annotations:
      summary: Hikari 풀 포화 ({{ $labels.pool }})
      description: active 커넥션이 max 와 같은 상태가 2분 이상 지속됨.
    isPaused: false
  - uid: pb-jvmheaphigh
    title: JvmHeapHigh
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: |-
          group without () (sum by (instance) (jvm_memory_used_bytes{job="pawbridge-monolith", area="heap"})
            /
          sum by (instance) (jvm_memory_max_bytes{job="pawbridge-monolith", area="heap"} > 0)
            > 0.85)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: |-
          sum by (instance) (jvm_memory_used_bytes{job="pawbridge-monolith", area="heap"})
            /
          sum by (instance) (jvm_memory_max_bytes{job="pawbridge-monolith", area="heap"} > 0)
            > 0.85
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 600s
    labels:
      severity: warning
      source_group: pawbridge-warning
    annotations:
      summary: JVM heap 사용률 {{ $values.B.Value | humanizePercentage }}
      description: heap 사용률이 85% 를 넘는 상태가 10분 지속됨. 메모리 누수/-Xmx 부족 가능성.
    isPaused: false
  - uid: pb-logbackerrors
    title: LogbackErrors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (increase(logback_events_total{job="pawbridge-monolith",
          level="error"}[5m]) > 0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: increase(logback_events_total{job="pawbridge-monolith", level="error"}[5m])
          > 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
      source_group: pawbridge-warning
    annotations:
      summary: ERROR 로그 {{ $values.B.Value | printf "%.0f" }}건 / 5분
      description: monolith 가 최근 5분 동안 ERROR 레벨 로그를 남겼다. Grafana 대시보드의 로그 패널에서 확인.
    isPaused: false
  - uid: pb-monolithscrapeslow
    title: MonolithScrapeSlow
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (scrape_duration_seconds{job="pawbridge-monolith"}
          > 5)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: scrape_duration_seconds{job="pawbridge-monolith"} > 5
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 300s
    labels:
      severity: warning
      source_group: pawbridge-warning
    annotations:
      summary: monolith /actuator/prometheus 응답 지연 {{ $values.B.Value | humanizeDuration
        }}
      description: scrape 소요 시간이 5분 연속 5초를 넘었다.
    isPaused: false
  - uid: pb-observabilitycomponentdown
    title: ObservabilityComponentDown
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (up{job=~"loki|alloy|grafana"} == 0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: up{job=~"loki|alloy|grafana"} == 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 300s
    labels:
      severity: warning
      source_group: pawbridge-warning
    annotations:
      summary: '관측성 구성요소 다운: {{ $labels.job }}'
      description: "{{ $labels.job }} scrape 가 5분 넘게 실패 중이다. 로그 수집/대시보드가 영향을 받을 수
        있다."
    isPaused: false
- orgId: 1
  name: pawbridge-metric-health
  folder: PawBridge
  interval: 1m
  rules:
  - uid: pb-paymentcompensationgaugeunavailable
    title: PaymentCompensationGaugeUnavailable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: group without () (pawbridge_payment_compensation_open{job="pawbridge-monolith"}
          != pawbridge_payment_compensation_open{job="pawbridge-monolith"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: pawbridge_payment_compensation_open{job="pawbridge-monolith"} != pawbridge_payment_compensation_open{job="pawbridge-monolith"}
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 300s
    labels:
      severity: warning
      source_group: pawbridge-metric-health
    annotations:
      summary: 결제 보상 지표 조회 실패
      description: pawbridge_payment_compensation_open 이 5분 넘게 NaN이다. 결제 보상 테이블/권한/DB
        상태를 확인할 것. 이 동안 결제 보상 긴급 알림은 동작하지 않는다.
    isPaused: false
