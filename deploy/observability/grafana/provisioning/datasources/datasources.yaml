# Grafana 데이터소스 프로비저닝. UID 를 고정해 대시보드 JSON 이 이름 변경에 흔들리지 않게 한다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s # prometheus.yml 의 scrape_interval 과 맞춘다

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
