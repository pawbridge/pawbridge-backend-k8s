# 대시보드 파일 프로바이더. compose 가 ./grafana/dashboards 를 /etc/grafana/dashboards 에 읽기 전용으로 마운트한다.
apiVersion: 1

providers:
  - name: pawbridge
    orgId: 1
    folder: PawBridge
    type: file
    disableDeletion: true
    allowUiUpdates: false # UI 편집본은 저장되지 않는다. 수정은 JSON 파일에서 한다.
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
