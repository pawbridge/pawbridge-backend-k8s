spring:
  application:
    name: community-service

  data:
    redis:
      connect-timeout: 2s
      timeout: 2s

  # Community uses PostgreSQL in every environment; credentials remain externally supplied.
  datasource:
    url: ${COMMUNITY_POSTGRESQL_JDBC_URL}
    username: ${COMMUNITY_POSTGRESQL_USERNAME}
    password: ${COMMUNITY_POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: pawbridge_community
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: ${COMMUNITY_POSTGRESQL_POOL_MAX:5}
      minimum-idle: ${COMMUNITY_POSTGRESQL_POOL_MIN:0}
      connection-timeout: 5000
      validation-timeout: 1000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pawbridge_community
        jdbc.time_zone: UTC

  sql:
    init:
      mode: never

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration

  # S3-compatible object storage (Cloudflare R2)
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 2000
            readTimeout: 3000
    aws:
      credentials:
        access-key: ${R2_ACCESS_KEY_ID}
        secret-key: ${R2_SECRET_ACCESS_KEY}
      region:
        static: ${R2_REGION:auto}
      s3:
        endpoint: ${R2_ENDPOINT}
        path-style-access-enabled: true
        chunked-encoding-enabled: false
        bucket: ${R2_BUCKET_NAME}

  servlet:
    multipart:
      max-file-size: 100MB      # 단일 파일 최대 크기 (영상 지원)
      max-request-size: 200MB   # 전체 요청 최대 크기

  # Kafka 설정
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: community-service-elasticsearch-group
      auto-offset-reset: earliest

# Service URLs (K8s Service DNS 기반)
service:
  user:
    url: ${USER_SERVICE_URL:http://user-service:8080}

# K8s Probe 설정 (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    redis:
      enabled: ${MEMBER_CHAT_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] - %msg%n"

server:
  port: 8082

pawbridge:
  search:
    backend: postgresql
    rebuild-enabled: ${SEARCH_REBUILD_ENABLED:false}
  chat:
    enabled: ${MEMBER_CHAT_ENABLED:false}
    namespace: ${MEMBER_CHAT_NAMESPACE:}
    allowed-origins: ${MEMBER_CHAT_ALLOWED_ORIGINS:}
  storage:
    public-base-url: ${R2_PUBLIC_BASE_URL:https://images.pawbridge.kr}
    object-prefix: ${R2_OBJECT_PREFIX:}
    session-token: ${R2_SESSION_TOKEN:}

youtube:
  api-key: ${YOUTUBE_DATA_API_KEY:}
