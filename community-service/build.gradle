plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pawbridge'
version = '0.0.1-SNAPSHOT'
description = 'community-service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2024.0.2")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.apache.lucene:lucene-analysis-nori:9.12.3'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'


	// Kafka
	implementation 'org.springframework.kafka:spring-kafka'

	// Elasticsearch
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

	// S3
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.0.3'

	// Jackson
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// Monitoring (Prometheus & Zipkin)
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.flywaydb:flyway-core'
	testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'real-r2' }
}

// Never part of test/check: requires separate approval and explicitly supplied test credentials.
tasks.register('r2ContractTest', Test) {
	group = 'verification'
	description = 'Opt-in real R2 check on a unique dev-only object prefix; requires separate approval.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'real-r2' }
	maxHeapSize = '256m'
	outputs.upToDateWhen { false }
	doFirst {
		if (System.getenv('PAWBRIDGE_R2_CONTRACT_APPROVED') != 'yes') {
			throw new GradleException('Real R2 writes require separate approval before r2ContractTest.')
		}
	}
}

// The API artifact still excludes migrations; only the isolated application test loads them.
tasks.named('processTestResources') {
	from('src/migration/resources') { include 'db/postgresql/**' }
}

// Schema tools remain outside the API application's startup and runtime classpath.
apply from: 'gradle/schema-migration.gradle'
