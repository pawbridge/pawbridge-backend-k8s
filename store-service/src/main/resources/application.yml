spring:
  application:
    name: store-service

  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # DataSource 설정
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pawbridge_store}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    aws:
      credentials:
        access-key: ${R2_ACCESS_KEY_ID}
        secret-key: ${R2_SECRET_ACCESS_KEY}
      region:
        static: ${R2_REGION:auto}
      s3:
        endpoint: ${R2_ENDPOINT}
        path-style-access-enabled: true
        chunked-encoding-enabled: false
        bucket: ${R2_BUCKET_NAME}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100 # N+1 문제 완화 (Batch Size)

  # Kafka Consumer/Producer 상세 설정 (bootstrap-servers는 Config Repository에서)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: store-service-group
      auto-offset-reset: earliest

# K8s Probe 설정 (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] - %msg%n"

server:
  port: 8083

pawbridge:
  storage:
    public-base-url: ${R2_PUBLIC_BASE_URL:https://images.pawbridge.kr}
  search:
    product-index: ${STORE_PRODUCT_SEARCH_INDEX:store-products-read}
